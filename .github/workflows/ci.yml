name: CI
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Assert no Android internet permission
        run: '! grep -R "android.permission.INTERNET" android/app/src/main'
      # Consolidated §10/§11.4 assertions (design docs/architecture/gates-2-3-design.md)
      - name: Assert no second native sqlite in dependency tree
        run: '! grep -E "^  (sqlite3_flutter_libs|sqlcipher_flutter_libs|drift_flutter|sqflite)" pubspec.lock'
      - name: Assert SQLCipher source hook is configured
        run: |
          grep -A3 'user_defines' pubspec.yaml | grep -q 'source: sqlcipher'
      # Checked against the --no-dev graph: the doc's raw pubspec.lock grep
      # would trip on build_runner's dev-only transitive web_socket_channel,
      # which never ships. The release-APK aapt step below stays the
      # authoritative INTERNET gate.
      - name: Assert no network-capable packages
        # pipefail: without it the pipeline reports only the trailing grep,
        # which "passes" on empty input even when the command feeding it died.
        shell: bash -euo pipefail {0}
        run: |
          flutter pub deps --no-dev --style=compact > deps.txt
          ! grep -E "^- (http|dio|web_socket_channel|grpc|firebase_[a-z_]+|connectivity_plus) " deps.txt
      - name: Assert no raw sockets or HttpClient in app code
        run: '! grep -RE "HttpClient|(Raw)?(Secure)?Socket\.connect" lib/'
      - name: Assert Android backups disabled
        run: |
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml
          ! grep -R 'usesCleartextTraffic="true"' android/app/src/main
      - name: Assert no debugPrint in lib
        run: '! grep -R "debugPrint(" lib/'
      - name: Assert committed drift schema dump is current
        run: |
          dart run drift_dev schema dump lib/data/db/app_database.dart drift_schemas/loadout/
          git diff --exit-code drift_schemas/
      # The authoritative INTERNET gate: debug and profile builds inject the
      # permission for the VM service, so only the release artifact proves
      # the shipped app has none. Resolve aapt explicitly and fail if it is
      # missing — a gate that cannot run must not report success.
      - name: Assert release manifest has no INTERNET permission
        shell: bash -euo pipefail {0}
        run: |
          flutter build apk --release --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          aapt=$(ls -1 "${ANDROID_HOME:?ANDROID_HOME is unset}"/build-tools/*/aapt \
            | sort -V | tail -1)
          test -x "$aapt"
          "$aapt" dump permissions "$apk" > permissions.txt
          ! grep INTERNET permissions.txt
